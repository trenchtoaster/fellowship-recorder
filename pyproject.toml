[project]
name = "fellowship-recorder"
version = "0.5.0"
description = "Automatic Fellowship dungeon recorder"
readme = "README.md"
license = "MIT"
authors = [{ name = "trench", email = "trenchtoaster@gmail.com" }]
keywords = ["fellowship", "game", "recording", "screen-recorder", "linux"]
classifiers = ["Operating System :: POSIX :: Linux"]
dependencies = ["watchdog>=6.0.0", "pydantic>=2.0.0", "textual>=3.0.0"]
requires-python = ">=3.14"

[project.urls]
Homepage = "https://github.com/trenchtoaster/fellowship-recorder"
Repository = "https://github.com/trenchtoaster/fellowship-recorder"
Issues = "https://github.com/trenchtoaster/fellowship-recorder/issues"

[project.scripts]
fellowship-recorder = "fellowship_recorder.__main__:main"
parse-log = "fellowship_recorder.cli.parse_log:main"
generate-description = "fellowship_recorder.cli.generate_description:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.pip]
python = "3.14"

[tool.uv]
cache-dir = "./.uv_cache"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "ty>=0.0.56",
]

[tool.setuptools]
package-dir = { "fellowship_recorder" = "src/fellowship_recorder" }
packages = { find = { where = ["src"], include = ["fellowship_recorder*"] } }

[tool.ruff]
fix = true
src = ["src"]
line-length = 88
target-version = "py314"
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
]
ignore = [
    "E501",      # Line too long
    "ANN401",    # Any type is disallowed
]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
include = ["src"]
